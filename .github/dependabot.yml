version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      version-updates:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      version-updates:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security-patches:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
